<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;800&family=Red+Hat+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#f4f4f1;color:#16191d;font:15px/1.45 "Red Hat Text",sans-serif}
header{padding:18px 16px 10px;display:flex;justify-content:space-between;align-items:baseline}
.marca{font-family:"Red Hat Display";font-weight:800;font-size:20px}
.azul{display:grid;grid-template-columns:repeat(13,1fr);height:14px}
.azul i{background:#1f4fa3}.azul i:nth-child(2n){background:#fff;clip-path:polygon(0 0,100% 0,0 100%)}
.abas{display:flex;gap:4px;padding:12px 16px 0}
.abas a{flex:1;text-align:center;padding:9px 0;font-weight:600;font-size:14px;border-radius:999px;background:#e6e7e3}
.abas .on{background:#1f4fa3;color:#fff}
h1{font-family:"Red Hat Display";font-weight:500;font-size:28px;padding:16px 16px 2px}
.sub{padding:0 16px;color:#5b6168;font-size:13px}
.busca{margin:12px 16px 0;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #c9ccc8;color:#80868c}
.plen{padding:14px 16px 0}svg{width:100%;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px}
.chip{display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:8px;background:#fff;border:1px solid #c9ccc8;font-size:13px;font-weight:600}
.chip i{width:10px;height:10px;border-radius:2px}
.chip b{font-weight:400;color:#5b6168}
.card{margin:6px 16px;background:#fff;border-radius:14px;padding:12px;display:flex;gap:12px;border:1px solid #c9ccc8}
.foto{width:56px;height:72px;border-radius:8px;background:#c9ccc8}
.card h2{font-size:16px}.card p{font-size:13px;color:#5b6168}
</style></head><body>
