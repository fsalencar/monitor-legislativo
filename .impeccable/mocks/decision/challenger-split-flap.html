<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#1d1f21;color:#f2f2f0;font:15px/1.45 Barlow,sans-serif}
header{background:#121212;padding:16px}
.marca{font:700 22px "Barlow Condensed";letter-spacing:.02em}
.abas{display:flex;background:#121212;padding:0 16px}
.abas a{flex:1;padding:10px 0;text-align:center;font-weight:600;font-size:14px;color:#8a8f94}
.abas .on{color:#121212;background:#f5a623}
.busca{margin:12px 16px;padding:10px;background:#2a2c2e;color:#8a8f94;border-radius:4px}
svg{width:100%;display:block;padding:0 12px}
h2{font:700 18px "Barlow Condensed";padding:10px 16px 6px;color:#f5a623}
.board{margin:0 16px}
.r{display:grid;grid-template-columns:58px 1fr 54px;gap:4px;margin-bottom:4px}
.r span{background:#121212;padding:7px 6px;font:500 15px "Barlow Condensed";border-radius:3px;box-shadow:inset 0 -1px #2c2c2c}
.sim{color:#7ddc7d}.nao{color:#ff7b6b}
</style></head><body>

</body></html>
