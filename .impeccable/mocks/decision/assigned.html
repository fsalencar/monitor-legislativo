<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#fbfaf6;color:#1b1a17;font:15px/1.45 "Atkinson Hyperlegible",sans-serif}
.capa{background:#e9a3b8;padding:20px 16px 14px;border-bottom:3px solid #1b1a17}
.marca{font-size:13px;font-weight:700}
.casa{font-family:Rye,serif;font-size:40px;line-height:1;margin-top:10px}
.sub{font-size:13px;margin-top:6px}
.abas{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #1b1a17}
.abas a{padding:10px 8px;font-weight:700;font-size:14px;text-align:center;border-right:1px solid #1b1a17}
.abas a:last-child{border-right:0}
.abas .on{background:#1b1a17;color:#e9a3b8}
.abas .ver{background:#8fc79a}.abas .sen{background:#f3d34a}
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.f{border:1.5px solid #1b1a17;padding:8px 10px;font-size:14px;background:#fff}
.plen{padding:4px 16px 0}
svg{width:100%;height:auto;display:block}
.leg{margin:8px 16px 0;border-top:2px solid #1b1a17}
.row{display:grid;grid-template-columns:16px 1fr 40px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #1b1a17}
.sw{width:12px;height:12px;border-radius:50%;border:1.5px solid #1b1a17}
.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
</style></head><body>
<div class="capa"><div class="marca">Monitor Legislativo</div><div class="casa">Deputados</div><div class="sub">Câmara dos Deputados · 513 cadeiras em exercício</div></div>
<nav class="abas"><a class="ver">Vereadores</a><a class="on">Deputados</a><a class="sen">Senadores</a></nav>
<div class="filtros"><div class="f">Buscar pelo nome</div><div class="f">Todos os partidos ▾</div></div>

<path d="M0.17 -0.985A1 1 0 0 1 0.7 -0.71" stroke="#1baf7a" stroke-width=".14" fill="none" stroke-dasharray=".03 .025"/>

<path d="M0.35 -0.7A.78 .78 0 0 1 .78 0" stroke="#eda100" stroke-width=".14" fill="none" stroke-dasharray=".03 .025"/>
<path d="M-0.56 0A.56 .56 0 0 1 0 -0.56" stroke="#eb6834" stroke-width=".14" fill="none" stroke-dasharray=".03 .025"/>
<path d="M0 -0.56A.56 .56 0 0 1 .56 0" stroke="#008300" stroke-width=".14" fill="none" stroke-dasharray=".03 .025"/>
</g></svg></div>
<div class="leg">

</div>
</body></html>
