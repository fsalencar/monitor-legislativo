name: Ingestão Câmara, Senado, Presidência e Assembleias

on:
  schedule:
    - cron: "0 9 * * *"   # diário, 06h (Brasília)
  workflow_dispatch:
    inputs:
      historico:
        description: "Coletar todas as legislaturas"
        type: boolean
        default: false

concurrency: ingest-camara

jobs:
  deputados:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m monitor_ingest migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m monitor_ingest camara-deputados ${{ inputs.historico && '--historico' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m monitor_ingest camara-votacoes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m monitor_ingest senado-senadores
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m monitor_ingest camara-autorias
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m monitor_ingest camara-afastamentos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m monitor_ingest camara-presencas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m monitor_ingest camara-situacoes --limite 3000
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m monitor_ingest senado-mandatos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m monitor_ingest senado-votacoes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m monitor_ingest senado-autorias
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m monitor_ingest senado-licencas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m monitor_ingest presidente
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m monitor_ingest estaduais
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m monitor_ingest resumos --limite 150 --minutos 20
        if: env.GEMINI_API_KEY != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
