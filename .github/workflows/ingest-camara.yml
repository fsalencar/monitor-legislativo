name: Ingestão Câmara

on:
  schedule:
    - cron: "0 9 * * *"   # diário, 06h (Brasília)
  workflow_dispatch:
    inputs:
      historico:
        description: "Coletar todas as legislaturas"
        type: boolean
        default: false

concurrency: ingest-camara

jobs:
  deputados:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m monitor_ingest migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m monitor_ingest camara-deputados ${{ inputs.historico && '--historico' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
